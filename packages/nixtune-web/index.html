<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0f1115">
<title>nixtune</title>
<style>
/* Dark by default, light when the system asks. Written for a phone held in
   one hand first, then widened. */
:root {
  color-scheme: dark;
  --bg: #0f1115;
  --panel: #161a21;
  --raised: #1d222b;
  --line: #2a303b;
  --fg: #e6e8eb;
  --muted: #8b93a1;
  --accent: #7aa2f7;
  --accent-fg: #0f1115;
  --ok: #9ece6a;
  --error: #f7768e;
  --mono: ui-monospace, "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Inter, sans-serif;
}
@media (prefers-color-scheme: light) {
  :root {
    color-scheme: light;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --raised: #eef0f4;
    --line: #d8dce3;
    --fg: #1c2027;
    --muted: #5d6573;
    --accent: #2f5bd3;
    --accent-fg: #ffffff;
    --ok: #3d7a1a;
    --error: #b3261e;
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 var(--sans); -webkit-tap-highlight-color: transparent; }
main { min-height: 100%; display: flex; flex-direction: column; max-width: 44rem; margin: 0 auto; }

button, input {
  font: inherit; color: var(--fg); background: var(--raised);
  border: 1px solid var(--line); border-radius: 8px; padding: .5rem .8rem;
}
button { cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
button.ghost { background: transparent; color: var(--muted); border-color: transparent; }
button:disabled { opacity: .45; cursor: default; }

/* Top bar: name, connection, which renderers exist. */
.top { position: sticky; top: 0; z-index: 2; background: var(--panel); border-bottom: 1px solid var(--line); padding: .7rem 1rem; display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: .5rem; font: 600 1.05rem var(--mono); margin-right: auto; }
.brand .host { color: var(--muted); font-weight: 400; font-size: .85rem; }
.dot { width: .6rem; height: .6rem; border-radius: 50%; background: var(--error); display: inline-block; }
.dot.on { background: var(--ok); }
.badges { display: flex; gap: .4rem; flex-wrap: wrap; }
.badge { font: .72rem var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: .1rem .55rem; }

/* Tabs. */
.tabs { display: flex; gap: .3rem; padding: .6rem 1rem 0; overflow-x: auto; }
.tab { background: transparent; border-color: transparent; color: var(--muted); white-space: nowrap; }
.tab.current { color: var(--fg); border-color: var(--line); background: var(--raised); }

.page { flex: 1; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
.empty { color: var(--muted); text-align: center; margin: 3rem auto; max-width: 24rem; }
.note { color: var(--muted); font-size: .9rem; margin: 0; }

/* Now playing. */
.now { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 1.25rem 1rem; display: flex; flex-direction: column; gap: .35rem; }
.now .title { font-size: 1.35rem; font-weight: 600; overflow-wrap: anywhere; }
.now .line, .song .line { color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
.progress { display: flex; align-items: center; gap: .6rem; margin-top: .6rem; font: .8rem var(--mono); color: var(--muted); }
.bar { flex: 1; height: .35rem; background: var(--raised); border-radius: 999px; overflow: hidden; }
.fill { height: 100%; background: var(--accent); }
.controls { display: flex; justify-content: center; align-items: center; gap: .6rem; }
.controls button { font-size: 1.25rem; min-width: 3.2rem; min-height: 3.2rem; border-radius: 50%; }
.controls button.big { font-size: 1.6rem; min-width: 4.2rem; min-height: 4.2rem; }
.modes { display: flex; justify-content: center; gap: .5rem; }
.mode { color: var(--muted); }
.mode.on { color: var(--fg); border-color: var(--accent); }

/* The host's volume bar, pinned to the bottom on every view. */
.volbar { position: sticky; bottom: 0; z-index: 2; background: var(--panel); border-top: 1px solid var(--line); padding: .6rem 1rem calc(.6rem + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: .6rem; }
.volbar .mute, .volbar .step { flex: none; font-size: 1.3rem; min-width: 3.1rem; min-height: 3.1rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.volbar .mute.on { border-color: var(--error); color: var(--error); }
/* Display only. pointer-events off, so a tap that lands here does nothing
   at all rather than setting a level. */
.volbar .meter { flex: 1; min-width: 0; height: .5rem; background: var(--raised); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; pointer-events: none; }
.volbar .fillv { height: 100%; background: var(--accent); }
.volbar .level { flex: none; font: .95rem var(--mono); color: var(--fg); min-width: 2.2rem; text-align: right; }

/* Lists: the queue, the library, the stations. */
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .35rem; }
.list li { display: flex; align-items: center; gap: .4rem; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: .25rem .25rem .25rem .5rem; }
.list li.current { border-color: var(--accent); }
.list .grow { flex: 1; text-align: left; background: transparent; border-color: transparent; padding: .5rem .4rem; min-width: 0; }
.list .title { overflow-wrap: anywhere; }
.list .time { font: .8rem var(--mono); color: var(--muted); }
.row-actions { display: flex; gap: .5rem; justify-content: flex-end; }
.crumbs { display: flex; flex-wrap: wrap; gap: .25rem; align-items: center; }
.crumb { background: transparent; border-color: transparent; color: var(--accent); padding: .25rem .4rem; }
.crumb + .crumb::before { content: "/"; color: var(--muted); margin-right: .4rem; }

/* Attribution, the guest footer, search, the QR tab, the scan badge. */
.added { color: var(--accent); font-size: .85rem; }
.me { color: var(--muted); font: .8rem var(--mono); text-align: center; padding: .6rem 1rem 1rem; }
.search { display: flex; gap: .5rem; }
.search input { flex: 1; min-width: 0; }
.crumb-static { color: var(--muted); padding: .25rem .4rem; }
.plus { color: var(--muted); padding: 0 .6rem; font-size: 1.2rem; }
.badge.scanning { color: var(--accent); border-color: var(--accent); }

/* The library's own status line. */
.scan { display: flex; align-items: center; gap: .7rem; background: color-mix(in srgb, var(--accent) 12%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); border-radius: 10px; padding: .6rem .8rem; font-size: .9rem; }
.scan.idle { background: var(--raised); border-color: var(--line); color: var(--muted); }
.spin { width: .9rem; height: .9rem; flex: none; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.qr { display: flex; flex-direction: column; align-items: center; gap: .75rem; padding-top: 1rem; }
.qr img { width: min(80vw, 22rem); height: auto; background: #fff; padding: .75rem; border-radius: 12px; }
.qr .url { font: 1rem var(--mono); margin: 0; overflow-wrap: anywhere; text-align: center; }

.error { color: var(--error); background: color-mix(in srgb, var(--error) 10%, transparent); border-top: 1px solid color-mix(in srgb, var(--error) 40%, transparent); padding: .6rem 1rem; margin: 0; position: sticky; bottom: 0; }

@media (min-width: 40rem) {
  .page { padding: 1.5rem; }
  .now { padding: 1.75rem 1.5rem; }
}
</style>
<script defer src="index.js"></script>
</head>
<body></body>
</html>
